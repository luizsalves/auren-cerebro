<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cérebro — entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui,sans-serif;color:#E9E9F2;
    background:radial-gradient(1000px 640px at 50% 45%,#3A1A9E 0%,#24116F 42%,#10073A 100%)}
  form{width:min(360px,calc(100vw - 40px));box-sizing:border-box;padding:32px;border-radius:20px;background:rgba(36,20,100,.5);
    border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(18px);display:flex;flex-direction:column;gap:14px}
  h1{margin:0 0 4px;font:600 26px 'Space Grotesk',Inter,sans-serif;display:flex;align-items:center;gap:10px}
  label{font:600 11px 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#A3A6BD}
  input{height:46px;box-sizing:border-box;padding:0 14px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:#fff;font:15px Inter,sans-serif;outline:0}
  input:focus{border-color:#4FD1E8}
  button{height:46px;border:0;border-radius:12px;background:#F2F2F7;color:#10073A;font:600 15px Inter,sans-serif;cursor:pointer}
  .erro{color:#FFBFA6;font-size:13px}
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#C9BBFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 3.5a3 3 0 0 0-3 3 3 3 0 0 0-2.5 4.5A3 3 0 0 0 5 16a3 3 0 0 0 4.5 3 2.5 2.5 0 0 0 2.5-1V5.5a2.5 2.5 0 0 0-2.5-2z"/><path d="M14.5 3.5a3 3 0 0 1 3 3 3 3 0 0 1 2.5 4.5A3 3 0 0 1 19 16a3 3 0 0 1-4.5 3 2.5 2.5 0 0 1-2.5-1"/></svg>
    cérebro
  </h1>
  <label for="senha">Senha</label>
  <input id="senha" name="senha" type="password" autocomplete="current-password" autofocus required>
  <div class="erro" id="erro" hidden>Senha incorreta.</div>
  <button type="submit">Entrar</button>
</form>
<script>if (location.search.includes('erro')) document.getElementById('erro').hidden = false;</script>
</body>
</html>
